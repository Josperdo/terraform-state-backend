# .github/workflows/terraform-ci.yml
#
# Three jobs, two separate OIDC identities, split by privilege:
#
#   validate — every PR. fmt, validate, `terraform test` (mocked provider),
#     and a checkov security scan. No Azure credentials at all.
#
#   plan — every PR. Uses the "plan" identity: Reader on the resource
#     group (no ARM write actions) plus blob data access to read this
#     repo's own state. Writes the plan to the job summary for review.
#
#   apply — MANUAL ONLY (workflow_dispatch from main), never automatic.
#     GitHub's "required reviewers" environment protection isn't available
#     on a private free-tier repo, so the human gate is structural: there
#     is no automatic trigger, only someone with write access can dispatch
#     it, and it refuses to run against anything but `main`. Uses the
#     "apply" identity (Contributor, scoped to this resource group).
#     Contributor excludes Microsoft.Authorization/*/write, so even this
#     identity cannot change role assignments — rbac.tf is applied locally
#     by a human, and both jobs -target only the three backend resources.
#
# One-time external setup:
#   1. Two Azure AD app registrations, each with one federated credential:
#        ci-plan  — subject ends in  :pull_request
#        ci-apply — subject ends in  :environment:production
#      GitHub's OIDC subject for this repo uses the ID-based format
#        repo:<owner>@<owner-id>/<repo>@<repo-id>:<context>
#      not the older repo:<owner>/<repo>:<context> shown in many tutorials
#      — a mismatch fails login with AADSTS700213. Read the real subject
#      from a failed run's error rather than constructing it by hand.
#   2. Repo secrets: AZURE_PLAN_CLIENT_ID, AZURE_APPLY_CLIENT_ID,
#      AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID — identifiers, not
#      credentials (OIDC means there's no secret material), stored as
#      secrets so they're masked in logs.
#   3. Repo variable: TF_STATE_STORAGE_ACCOUNT_NAME.
#   4. A "production" GitHub Environment (the apply credential's subject).

name: Terraform CI

on:
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tftest.hcl"
      - ".terraform.lock.hcl"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch: {} # runs `apply` only — see job-level guard below

# Least privilege by default; jobs that need an OIDC token opt in.
permissions:
  contents: read

env:
  TF_VERSION: "1.14.7"
  TF_IN_AUTOMATION: "true"
  # Non-secret values for backend init and required variables (there's no
  # terraform.tfvars in CI — it's gitignored). Terraform reads TF_VAR_*
  # automatically; the init steps reuse the same shell variables so each
  # value is defined exactly once.
  TF_VAR_resource_group_name: "rg-tfstate-backend"
  TF_VAR_container_name: "tfstate"
  TF_VAR_storage_account_name: ${{ vars.TF_STATE_STORAGE_ACCOUNT_NAME }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -diff -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform test (mocked provider, no Azure access)
        run: terraform test

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Security scan (checkov)
        run: |
          pip install --quiet checkov==3.4.3
          checkov --directory . --framework terraform --compact --quiet

  plan:
    # Skipped on Dependabot PRs: GitHub withholds Actions secrets from
    # Dependabot-triggered runs by design, and copying Azure credentials
    # into Dependabot's own secret store would hand them to PRs made of
    # third-party code. validate still gates those PRs; to get a plan,
    # push any commit to the Dependabot branch yourself (the run is then
    # triggered by you and gets the normal secrets).
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for Azure login
    concurrency:
      group: terraform-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login (OIDC — plan identity)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init (remote backend)
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${TF_VAR_resource_group_name}" \
            -backend-config="storage_account_name=${TF_VAR_storage_account_name}" \
            -backend-config="container_name=${TF_VAR_container_name}"

      # Targeted to the same three resources apply is scoped to. An
      # untargeted plan would also evaluate rbac.tf, and with no
      # terraform.tfvars in CI its principal IDs fall back to empty/null —
      # rendering a false "destroy" diff for role assignments that are
      # actually fine (they're managed locally, not by CI).
      - name: Terraform plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan \
            -target=azurerm_resource_group.state \
            -target=azurerm_storage_account.state \
            -target=azurerm_storage_container.state

      - name: Write plan to job summary
        if: always()
        run: |
          if [ -f tfplan ]; then
            {
              echo '### Terraform plan'
              echo '```'
              terraform show -no-color tfplan
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

  apply:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC token for Azure login
    concurrency:
      group: terraform-apply
      cancel-in-progress: false # never kill an apply mid-flight
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login (OIDC — apply identity)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init (remote backend)
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${TF_VAR_resource_group_name}" \
            -backend-config="storage_account_name=${TF_VAR_storage_account_name}" \
            -backend-config="container_name=${TF_VAR_container_name}"

      # Plan to a file, then apply exactly that file — the log and job
      # summary show precisely what was applied. Same -target scope as the
      # plan job; rbac.tf stays local/manual by policy and by permission.
      - name: Terraform plan (storage backend only)
        run: |
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan \
            -target=azurerm_resource_group.state \
            -target=azurerm_storage_account.state \
            -target=azurerm_storage_container.state
          {
            echo '### Applied plan'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Terraform apply
        run: terraform apply -input=false -lock-timeout=5m tfplan
