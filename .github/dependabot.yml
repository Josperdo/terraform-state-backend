# Keeps SHA-pinned GitHub Actions and the azurerm provider current.
# Each update arrives as a PR, so validate/plan run against it before merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /
    schedule:
      interval: monthly
